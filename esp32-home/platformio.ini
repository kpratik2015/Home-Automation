; Seeed XIAO ESP32-C6 - home automation firmware
; ESP32-C6 needs Arduino 3.x via pioarduino (stock espressif32 is Arduino 2.x only).

; --- Pick one env when flashing ---
; home         - 24/7 WiZ guard + fan/lamp BLE (default production)
; wifi_guard   - WiZ only (no fan BLE)
; fan_ble_only - fan/light serial test only (no WiFi)
; seeed_xiao_esp32c6 - same as home (legacy env name)

[platformio]
default_envs = home

[env:home]
extends = env:seeed_xiao_esp32c6

[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
upload_port = /dev/cu.usbmodem101
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:wifi_guard]
extends = env:seeed_xiao_esp32c6
build_src_filter = +<*> -<fan_ble.cpp>
lib_ldf_mode = chain+
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D FAN_BLE_SERIAL_ENABLED=0
board_build.partitions = default.csv

[env:fan_ble_only]
extends = env:seeed_xiao_esp32c6
build_src_filter = +<*> -<wiz_guard.cpp>
lib_ldf_mode = chain+
lib_ignore = ArduinoJson
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D WIFI_DISABLED=1
    -D WIZ_GUARD_ENABLED=0
board_build.partitions = huge_app.csv
